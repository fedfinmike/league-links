<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">Abstract rugby player silhouette</title>
  <desc id="desc">A stylised back-view rugby league player with stadium lights and geometric connection lines.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132e39"/>
      <stop offset="0.55" stop-color="#07161d"/>
      <stop offset="1" stop-color="#02090d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55e5d3" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#efc46d" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#6cf1df" stop-opacity="0.75"/>
      <stop offset="0.25" stop-color="#57dfcf" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#57dfcf" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
