<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>League Links</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#07111b;color:#f5f7fb;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.loader{width:min(520px,calc(100vw - 48px));text-align:center}.mark{width:58px;height:58px;margin:0 auto 20px;border-radius:17px;background:linear-gradient(145deg,#ffd67f,#f2b84b);color:#101820;display:grid;place-items:center;font-weight:900;box-shadow:0 14px 40px rgba(242,184,75,.2)}h1{margin:0 0 8px;font-size:30px;letter-spacing:-1px}p{margin:0;color:#91a0b4}.bar{height:5px;background:#132235;border-radius:99px;margin:26px 0 10px;overflow:hidden}.bar i{display:block;height:100%;width:12%;border-radius:99px;background:#f2b84b;animation:load 1.25s ease-in-out infinite alternate}@keyframes load{to{width:86%}}#status{font-size:12px;color:#66758a}.error{color:#ff9b9b!important}
</style>
</head>
<body>
<div class="loader"><div class="mark">LL</div><h1>League Links</h1><p>Loading the rugby league player network…</p><div class="bar"><i></i></div><div id="status">Preparing exact teammate data</div></div>
<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const parts=Array.from({length:15},(_,i)=>`payload/part-${String(i+1).padStart(2,'0')}.txt`);
  status.textContent='Loading player and teammate data';
  const texts=await Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'force-cache'});if(!r.ok)throw new Error(`${p}: ${r.status}`);return r.text();}));
  status.textContent='Building League Links';
  const b64=texts.join('').trim();
  const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(!('DecompressionStream' in window))throw new Error('Your browser does not support compressed web data. Please use a current Chrome, Edge, Firefox or Safari.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(err){console.error(err);status.textContent='League Links could not load. Refresh the page or use a current browser.';status.classList.add('error');}
})();
</script>
</body>
</html>
