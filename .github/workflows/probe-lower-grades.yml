name: Probe live rugby league sources
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_championdata.py'
      - 'scripts/refresh_nrl_2026.py'
      - 'scripts/check_2026_freshness.py'
      - '.github/workflows/probe-lower-grades.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect participation anomaly
        run: python scripts/probe_championdata.py
