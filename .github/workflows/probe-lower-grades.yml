name: Probe live rugby league sources
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_championdata.py'
      - 'scripts/probe_nrl_official.py'
      - '.github/workflows/probe-lower-grades.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect lower-grade source
        run: python scripts/probe_championdata.py
      - name: Inspect official NRL current-season pages
        run: python scripts/probe_nrl_official.py
