name: Probe rugby league match sources
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_championdata.py'
      - 'scripts/probe_internationals.py'
      - '.github/workflows/probe-lower-grades.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect international source paths
        run: python scripts/probe_internationals.py
