name: Build v0.28 international exact data
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-international-v28.yml'
permissions:
  contents: write
concurrency:
  group: league-links-international-v28
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact graph baseline
        run: |
          python scripts/build_data.py
          python scripts/build_rlp_exact.py
          python scripts/merge_lower_grades.py
      - name: Build exact internationals 2000-2026
        run: python scripts/build_internationals.py
      - name: Merge international teammate and opponent evidence
        run: |
          python scripts/merge_internationals.py
          python scripts/build_opponents.py
          python scripts/merge_opponents.py
      - name: Validate v0.28 prepared corpus
        run: |
          python - <<'PY'
          import gzip,json,sys
          with open('data/build-meta.json',encoding='utf-8') as f: m=json.load(f)
          with open('data/opponents-meta.json',encoding='utf-8') as f: o=json.load(f)
          with gzip.open('data/league-links.json.gz','rb') as f: g=json.loads(f.read())
          assert 'International' in m.get('competitions',[]), m
          assert m.get('internationalMatchesExact',0)>0, m
          assert m.get('internationalAppearancesExact',0)>0, m
          assert o.get('version')==28, o
          assert g.get('version')==24, g.get('version')
          intl=[r for r in g.get('career',[]) if len(r)>=5 and r[2]=='International']
          assert intl, 'no international career rows'
          names={str(p['id']):p.get('name','') for p in g.get('players',[])}
          def ids(name): return [i for i,n in names.items() if n.lower()==name.lower()]
          checks={n:ids(n) for n in ['Johnathan Thurston','Matthew Scott','Cameron Smith']}
          print(json.dumps({'buildMeta':m,'opponentMeta':o,'internationalCareerRows':len(intl),'identityChecks':checks},indent=2))
          PY
      - name: Save v0.28 prepared data
        run: |
          set -euo pipefail
          git config user.name "League Links data bot"
          git config user.email "actions@users.noreply.github.com"

          # Preserve the validated generated corpus, then move onto whatever is
          # currently at the branch tip before committing. This avoids replaying
          # stale development commits if the UI/workflow changed during a long
          # historical-source build.
          tmpdir="$(mktemp -d)"
          cp data/league-links.json.gz "$tmpdir/league-links.json.gz"
          cp data/build-meta.json "$tmpdir/build-meta.json"
          cp data/opponents.json.gz "$tmpdir/opponents.json.gz"
          cp data/opponents-meta.json "$tmpdir/opponents-meta.json"

          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          cp "$tmpdir/league-links.json.gz" data/league-links.json.gz
          cp "$tmpdir/build-meta.json" data/build-meta.json
          cp "$tmpdir/opponents.json.gz" data/opponents.json.gz
          cp "$tmpdir/opponents-meta.json" data/opponents-meta.json

          git add data/league-links.json.gz data/build-meta.json data/opponents.json.gz data/opponents-meta.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Build v0.28 exact international corpus"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
