name: Build League Links data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
  push:
    paths:
      - 'scripts/build_data.py'
      - '.github/workflows/build-data.yml'
permissions:
  contents: write
concurrency:
  group: league-links-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build prepared data file
        run: python scripts/build_data.py
      - name: Save prepared data file
        run: |
          git config user.name "League Links data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/league-links.json.gz data/build-meta.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh League Links data"
            git push
          fi
