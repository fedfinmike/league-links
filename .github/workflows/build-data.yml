name: Build League Links data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
  push:
    paths:
      - 'scripts/build_data.py'
      - 'scripts/build_opponents.py'
      - 'scripts/build_season_catalogues.py'
      - 'sources/international_teams.json'
      - 'sources/players.csv'
      - 'sources/confirmed_appearances.csv'
      - '.github/workflows/build-data.yml'
permissions:
  contents: write
concurrency:
  group: league-links-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build prepared data files
        run: |
          python scripts/build_data.py
          python scripts/build_opponents.py
          python scripts/build_season_catalogues.py
      - name: Save prepared data files
        run: |
          git config user.name "League Links data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/league-links.json.gz data/build-meta.json data/opponents.json.gz data/opponents-meta.json data/season-catalogues.json.gz data/season-catalogues-meta.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh League Links data"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
